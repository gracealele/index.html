body{font-family:'Manrope','Segoe UI',system-ui,sans-serif;font-size:15px;line-height:1.5;color:var(--ink);background:var(--bg)}
h1,h2,h3{font-family:'Manrope','Segoe UI',sans-serif;margin:0}
h1{font-weight:700;font-size:clamp(30px,4vw,42px);line-height:1.05;letter-spacing:-.02em}
h2{font-weight:700;font-size:21px}
h3{font-weight:700;font-size:17px}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
input,textarea,select{font:inherit;color:inherit}
a{color:var(--green)}
:focus-visible{outline:3px solid var(--leaf);outline-offset:2px}
.shell{display:flex;min-height:100%}
.nav{flex:0 0 248px;background:var(--olive);color:#E2E2E2;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;padding:18px 14px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;color:#F4F5EF;font-family:'Manrope',sans-serif;font-weight:800;letter-spacing:-.02em;font-size:22px}
.brand i{width:30px;height:30px;border-radius:9px;background:var(--accent);color:#394508;display:grid;place-items:center;font-style:normal;font-size:16px}
.nav .grp{margin:14px 10px 4px;font-size:11.5px;letter-spacing:.06em;color:#B5C48F;font-weight:600}
.nav button.it{display:flex;align-items:center;gap:10px;width:100%;min-height:40px;padding:0 10px;border:0;border-radius:10px;background:transparent;color:#E2E2E2;text-align:left;font-size:14.5px}
.nav button.it:hover{background:#4A5A12}
.nav button.it[aria-current=page]{background:var(--lime);color:var(--olive);font-weight:700}
.nav .cnt{margin-left:auto;min-width:22px;height:20px;padding:0 6px;border-radius:99px;background:var(--accent);color:#394508;font-size:12px;font-weight:700;display:grid;place-items:center}
.nav .foot{margin-top:auto;padding:12px 10px 0;font-size:13px;color:#B5C48F}
main{flex:1;min-width:0;padding:22px clamp(16px,3.5vw,48px) 56px}
.wrap{max-width:none;display:flex;flex-direction:column;gap:20px}
.demo{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:8px 14px;border-radius:10px;background:#FBEBD0;color:#394508;font-size:13.5px}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{flex:1 1 280px;display:flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:12px;background:var(--card);box-shadow:0 0 0 1px var(--line);color:var(--quiet)}
.search input{flex:1;border:0;outline:0;background:transparent;min-width:0}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.btn{min-height:42px;padding:0 18px;border-radius:999px;border:1px solid #E2E2E2;background:var(--card);font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--green);border-color:var(--green);color:#FFFFFF;font-weight:600}
.btn.pri:hover{background:var(--green2)}
.btn.dark{background:var(--olive);border-color:var(--olive);color:#F4F5EF;font-weight:600}
.btn.ghost{border-color:transparent;background:transparent;color:var(--quiet)}
.btn.sm{min-height:34px;padding:0 12px;font-size:13.5px}
.btn.danger{color:#6B4A10}
.card{background:var(--card);border-radius:20px;box-shadow:0 0 0 1px var(--line);padding:18px 20px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
.muted{color:var(--quiet)}
.small{font-size:13.5px}
.tiny{font-size:12.5px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.mono{flex:none;border-radius:12px;color:#FFFFFF;display:grid;place-items:center;font-weight:700}
.dock{display:flex;flex-wrap:wrap;gap:4px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;width:84px;padding:8px 4px;border:0;border-radius:14px;background:transparent}
.tile[aria-pressed=true]{background:var(--bg)}
.tile[aria-pressed=true] .mono{box-shadow:0 0 0 3px #FFFFFF,0 0 0 5px var(--ink)}
.tile span.nm{font-size:12.5px;font-weight:500;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{position:absolute;top:2px;right:12px;min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:var(--accent);color:#394508;font-size:11.5px;font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 2px #FFFFFF}
.warn{position:absolute;top:4px;right:14px;width:12px;height:12px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px #FFFFFF}
.brief{display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px;padding:20px 24px;border-radius:20px;background:var(--olive);color:#E6F7CF}
.spark{flex:none;width:44px;height:44px;border-radius:50%;background:var(--accent);color:#394508;display:grid;place-items:center}
.item{display:flex;gap:14px;align-items:flex-start}
.draft{padding:10px 14px;border-radius:4px 14px 14px 14px;background:var(--line2);font-size:14.5px}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{min-height:36px;padding:0 12px;border-radius:99px;border:1px solid #E2E2E2;background:#FFFFFF;font-size:13.5px}
.tab[aria-pressed=true]{background:var(--olive);color:#F4F5EF;border-color:var(--olive);font-weight:600}
.overlay{position:fixed;inset:0;background:rgba(18,18,18,.45);display:grid;place-items:center;padding:16px;z-index:50}
.modal{width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;background:#FFFFFF;border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(18,18,18,.25)}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}
.field input,.field textarea,.field select{min-height:44px;border:1px solid #E2E2E2;border-radius:10px;padding:8px 12px;font-weight:400;background:#FFFFFF}
.chk{display:flex;align-items:center;gap:10px;min-height:40px;padding:0 12px;border:1px solid #E2E2E2;border-radius:10px;font-weight:400;cursor:pointer}
.chk:has(input:checked){border-color:var(--green);background:#F4F5EF}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#F4F5EF;padding:12px 18px;border-radius:12px;box-shadow:0 10px 30px rgba(18,18,18,.25);z-index:60;max-width:calc(100vw - 32px);font-size:14.5px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--quiet);font-weight:600;padding:10px 12px;border-bottom:1px solid #E2E2E2;white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line2);vertical-align:top}
.tablewrap{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(5,minmax(120px,1fr));gap:8px}
.calday{min-height:110px;background:#FFFFFF;border-radius:12px;box-shadow:0 0 0 1px var(--line);padding:8px;display:flex;flex-direction:column;gap:6px}
.post{border:0;text-align:left;padding:6px 8px;border-radius:8px;font-size:12.5px;line-height:1.3;background:var(--soft);box-shadow:inset 3px 0 0 var(--c)}
.post:hover{background:#E6F7CF}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:#FFFFFF;box-shadow:-10px 0 40px rgba(18,18,18,.18);z-index:55;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:14px}
.week{display:grid;grid-template-columns:56px repeat(5,minmax(110px,1fr));position:relative}
.voice{position:fixed;inset:0;background:rgba(18,18,18,.82);z-index:70;display:grid;place-items:center;padding:16px;color:#F4F5EF}
.ring{width:96px;height:96px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:#394508;animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(217,150,31,.6)}100%{box-shadow:0 0 0 28px rgba(217,150,31,0)}}
.phone{width:280px;border-radius:32px;background:#121212;padding:12px;margin:0 auto}
.phone .scr{background:#E2E2E2;border-radius:22px;min-height:420px;padding:14px;display:flex;flex-direction:column;gap:10px;color:#121212}
.bubble{background:#FFFFFF;border-radius:4px 12px 12px 12px;padding:10px 12px;font-size:13.5px;max-width:230px}
@media (max-width:860px){.shell{flex-direction:column}.nav{position:sticky;top:0;z-index:40;height:auto;flex:none;flex-direction:row;flex-wrap:nowrap;overflow-x:auto;gap:4px;padding:10px}.nav .grp,.nav .foot{display:none}.brand{padding:4px 8px;flex:none}.nav button.it{flex:none;white-space:nowrap}.nav button.it{width:auto;min-height:36px}}
@media (prefers-reduced-motion:reduce){.ring{animation:none}}

.tourcard{position:fixed;right:20px;bottom:20px;width:min(380px,calc(100vw - 32px));background:#FFFFFF;border-radius:20px;box-shadow:0 0 0 2px var(--leaf),0 20px 50px rgba(18,18,18,.25);padding:16px 18px;display:flex;flex-direction:column;gap:10px;z-index:65}
.wrap>.search,.wrap>form{flex:none}
@media (min-width:861px) and (max-width:1180px){.nav{flex-basis:216px}main{padding:20px 24px 48px}}
.wd{display:none}
@media (max-width:560px){.cal{grid-template-columns:repeat(2,1fr)}.calh{display:none}.wd{display:inline}}
.demoshort{display:none}
.item .pill{white-space:normal}
@media (max-width:560px){
 main{padding:14px 16px 40px}
 .wrap{gap:16px}
 .demofull{display:none}.demoshort{display:inline}
 .demo{padding:6px 12px;font-size:13px}
 .top{gap:8px}
 .top .search{flex-basis:100%;min-height:42px}
 .top .btn{min-height:38px;padding:0 12px;font-size:14px}
 .tile{width:70px;padding:6px 2px}
 .tile .mono{width:46px!important;height:46px!important;font-size:16px!important}
 .tile span.nm{font-size:11.5px;max-width:68px}
 .badge{right:6px}.warn{right:8px}
 .card{padding:14px 16px}
 .item{gap:10px}
 .item .btn{min-height:38px;padding:0 14px}
 h1{font-size:30px}
}
/* assistant personality & voice */
.aigrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.aiopt{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:14px;box-shadow:0 0 0 1px var(--line);background:#FFFFFF;cursor:pointer;position:relative}
.aiopt input[type=radio]{accent-color:var(--green);width:18px;height:18px;margin:0}
label.aiopt input[type=radio]{position:absolute;top:12px;right:12px}
.aiopt.on{box-shadow:0 0 0 2px #619111;background:#F7F8F3}
.aiopt:focus-within{outline:3px solid #619111;outline-offset:2px}
div.aiopt{flex-direction:row;align-items:center;gap:10px}
.aisample{margin-top:10px;padding:12px 14px;border-radius:14px;background:#394508;color:#E6F7CF}
.aisample .muted{color:#B5C48F}
.aisample p{margin:4px 0 0}
@media (max-width:560px){.aigrid{grid-template-columns:1fr}}
.modal>.row.between:first-child{flex-wrap:nowrap;align-items:flex-start;gap:8px}
.aigrid.voices{grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}@media (max-width:560px){.aigrid.voices{grid-template-columns:1fr}}
.aigrid.voices{grid-template-columns:repeat(3,minmax(0,1fr))}@media (max-width:760px){.aigrid.voices{grid-template-columns:1fr}}
/* engagement to sale */
.fstat{padding:14px 16px;border-radius:14px;background:#F7F8F3;display:flex;flex-direction:column;gap:2px}
.fbig{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.cbar{display:inline-block;vertical-align:middle;width:90px;height:12px;background:var(--line2);border-radius:3px;overflow:hidden;margin-right:8px}
.cbar>span{display:block;height:100%;border-radius:0 3px 3px 0}
.cval{font-variant-numeric:tabular-nums;font-weight:600}
.fcards{display:none}
@media (max-width:560px){.ftable{display:none}.fcards{display:flex;flex-direction:column;gap:8px}.fcard{padding:12px 14px;border-radius:12px;box-shadow:0 0 0 1px var(--line);display:flex;flex-direction:column;gap:4px}}
/* performance dashboard */
.dash{display:flex;flex-direction:column;gap:18px;padding:18px;border-radius:24px;background:linear-gradient(160deg,#F4F5EF 0%,#F7F8F3 55%,#EDEDED 100%)}
.dpanel{background:#FFFFFF;border-radius:18px;padding:18px 20px;box-shadow:0 1px 2px rgba(18,18,18,.04),0 8px 24px rgba(57,69,8,.06);min-width:0}
.dgrid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.dgrid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:18px}
.dcol{display:flex;flex-direction:column;gap:18px;min-width:0}
.dlabel{font-size:13.5px;font-weight:600;color:var(--quiet);margin:0}
.dbig{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:2px 0}
.dtitle{font-weight:700;font-size:16px;margin:0}
.dkey{display:flex;align-items:center;gap:5px;white-space:nowrap}
.dkey i{display:inline-block;width:9px;height:9px;border-radius:2px}
.dkey i.ln{width:14px;height:2px;background:#C0392B;border-radius:0;margin-left:6px}
.dsel{border:1px solid var(--line);border-radius:8px;min-height:34px;padding:0 8px;font:inherit;font-size:13px;background:#FFFFFF}
.mcombo{margin-top:12px}
.mcbars{position:relative;height:110px;display:flex;align-items:flex-end;gap:4px;border-bottom:1px solid var(--line)}
.mccol{flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center}
.mccol span{display:block;width:100%;max-width:34px;border-radius:4px 4px 0 0}
.mcline{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.mclabs{display:flex;gap:4px;margin-top:4px}
.mclabs span{flex:1;text-align:center;font-size:11px;color:var(--quiet);white-space:nowrap}
.pbar{display:grid;grid-template-columns:78px 1fr 56px;align-items:center;gap:10px}
.pbtrack{height:14px;background:var(--line2);border-radius:4px;overflow:hidden}
.pbtrack>span{display:block;height:100%;border-radius:0 4px 4px 0}
.ring2{position:relative;flex:none}
.ring2 svg{display:block}
.ring2in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.ring2in b{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.rings3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.rcell{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
.sarea{position:relative;height:260px;cursor:crosshair}
.sarea svg{width:100%;height:100%;display:block;overflow:visible}
.salabels span{position:absolute;right:6px;transform:translateY(-50%);font-size:12px;font-weight:700;color:#FFFFFF;text-shadow:0 1px 2px rgba(18,18,18,.35);pointer-events:none}
.satip{position:absolute;top:8px;background:#121212;color:#FFFFFF;border-radius:10px;padding:8px 10px;font-size:12.5px;display:flex;flex-direction:column;gap:3px;min-width:150px;pointer-events:none;z-index:5}
.satip span{display:flex;align-items:center;gap:6px}
.satip span b{margin-left:auto;font-variant-numeric:tabular-nums}
.satip i{display:inline-block;width:9px;height:9px;border-radius:2px}
.satip .sat{border-top:1px solid #3D3D3D;padding-top:3px;margin-top:2px}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:13px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.brief2{display:flex;gap:10px;align-items:flex-start;margin-top:auto;padding:12px 14px;border-radius:14px;background:#394508;color:#E6F7CF;font-size:14px}
.brief2 .spark{flex:none;width:32px;height:32px;border-radius:50%;background:var(--lime);color:var(--olive);display:grid;place-items:center}
.brief2 p{margin:0}
.pcircles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-top:14px}
.pcircle{display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;padding:14px 8px;border-radius:14px;background:#F7F8F3}
.pcircle p{margin:0}
@media (max-width:1100px){.dgrid2{grid-template-columns:1fr}.pcircles{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:820px){.dgrid3{grid-template-columns:1fr}}
@media (max-width:560px){.dash{padding:10px;gap:12px;border-radius:18px}.pcircles{grid-template-columns:repeat(2,minmax(0,1fr))}.rings3 .ring2{transform:scale(.8)}.sarea{height:200px}.dkey{display:none}}
.sawrap{flex:1;display:flex;flex-direction:column;min-height:0}.sawrap .sarea{flex:1;min-height:260px}
/* Performance page: main-design greens with coral and navy; Poppins */
.perf{font-family:'Poppins','Segoe UI',system-ui,sans-serif;color:#1F3A5F;display:flex;flex-direction:column;gap:16px}
.perf h1,.perf h2,.perf h3{font-family:'Poppins','Segoe UI',system-ui,sans-serif;color:#1F3A5F;letter-spacing:-.01em}
.perf .muted{color:#6B6B6B}
.perf select,.perf button,.perf input{font-family:inherit}
.perf .tab[aria-pressed=true]{background:#1F3A5F;color:#FFFFFF;border-color:#1F3A5F}
.perf .dash{background:linear-gradient(160deg,#FBEBD0 0%,#F7F8F3 55%,#FBEBD0 100%)}
.perf .dpanel{box-shadow:0 1px 2px rgba(31,58,95,.05),0 10px 28px rgba(31,58,95,.08)}
.perf .dlabel{color:#6B6B6B;font-weight:500}
.perf .dbig{font-weight:700;color:#1F3A5F}
.perf .dtitle{font-weight:600}
.perf .dkey i{background:#4E7A0C!important}
.perf .dkey i.ln{background:#E9604F!important}
.perf .ring2in b{font-weight:700;color:#1F3A5F}
.perf .brief2{background:#1F3A5F;color:#E3ECF5}
.perf .brief2 .spark{background:#D2FD9C;color:#1F3A5F}
.perf .pcircle{background:#F7F8F3}
.perf .pbtrack,.perf .cbar{background:#EDEDED}
.perf table th{color:#6B6B6B;font-weight:500}
.perf .pill{font-weight:500}
.sarea svg{position:absolute;inset:0}
/* dashboard v2: reference layout */
.dash2{display:grid;grid-template-columns:minmax(280px,.42fr) minmax(0,1fr);gap:18px;padding:18px;border-radius:26px;background:linear-gradient(160deg,#EDEDED 0%,#F4F5EF 50%,#E2E2E2 100%);box-shadow:inset 0 0 0 1px #E2E2E2}
.dleft{background:#FFFFFF;border-radius:20px;padding:6px 20px;box-shadow:0 1px 2px rgba(31,58,95,.05),0 12px 30px rgba(57,69,8,.08);display:flex;flex-direction:column;min-width:0}
.dsec{padding:16px 0;border-bottom:1px solid #EDEDED}
.dsec:last-child{border-bottom:0}
.dright{display:flex;flex-direction:column;gap:18px;min-width:0}
.dstrip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:#FFFFFF;border-radius:20px;box-shadow:0 1px 2px rgba(31,58,95,.05),0 12px 30px rgba(57,69,8,.08)}
.strip{padding:16px 18px;min-width:0}
.strip+.strip{border-left:1px solid #EDEDED}
.scbars{position:relative;height:120px;display:flex;align-items:flex-end;gap:3px;margin-top:10px;border-bottom:1px solid #E2E2E2}
.scbars .grid{position:absolute;left:0;right:0;height:0;border-top:1px dashed #EDEDED}
.sccol{flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center;position:relative;z-index:1}
.sccol span{display:block;width:100%;max-width:26px;border-radius:3px 3px 0 0}
.scline{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:2}
.dots{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;font-size:11px;color:#6B6B6B}
.dots i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0}
.dots i.ln{width:14px;height:3px;border-radius:2px;background:#E9604F;vertical-align:2px}
.dbig2{background:#FFFFFF;border-radius:20px;padding:18px 20px;box-shadow:0 1px 2px rgba(31,58,95,.05),0 12px 30px rgba(57,69,8,.08);flex:1;display:flex;flex-direction:column;min-width:0}
.plist{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.prow{display:grid;grid-template-columns:28px 72px 1fr 44px;align-items:center;gap:8px;font-size:13.5px}
.picon{width:28px;height:28px;border-radius:8px;color:#FFFFFF;font-size:11px;font-weight:700;display:grid;place-items:center}
.pname{font-weight:500}
.ptrack{height:8px;background:#EDEDED;border-radius:99px;overflow:hidden}
.ptrack>span{display:block;height:100%;border-radius:99px}
.prow b{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.bgauge{position:relative;width:min(240px,100%);aspect-ratio:1;margin:8px auto 0}
.bgauge svg{width:100%;height:100%;display:block}
.bgin{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.bgin b{font-size:36px;font-weight:800;color:#1F3A5F;letter-spacing:-.02em;line-height:1}
.bgin span{font-size:11px;color:#6B6B6B;max-width:110px;margin-top:4px;line-height:1.3}
.glegend{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 12px;margin-top:8px;font-size:12px}
.glegend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.g3>div{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}
.g3 p{margin:4px 0 0;font-size:12.5px;font-weight:600;line-height:1.3}
.fgauge{position:relative;width:96px;height:96px}
.fgauge svg{width:100%;height:100%;display:block}
.fgauge b{position:absolute;inset:0;display:grid;place-items:center;color:#FFFFFF;font-weight:700;font-size:16px}
.dbig2 .fgauge{width:64px;height:64px}
.dbig2 .fgauge b{font-size:12px}
.flow{display:grid;grid-template-columns:minmax(0,1fr) 128px;gap:14px;margin-top:12px;flex:1;min-height:260px}
.flowplot{position:relative;min-height:240px;cursor:crosshair;padding-bottom:20px}
.flowplot svg{position:absolute;left:0;right:0;top:0;bottom:20px;width:100%;height:calc(100% - 20px);display:block;overflow:visible}
.flowx{position:absolute;left:0;right:0;bottom:0}
.flowvals{display:flex;flex-direction:column;justify-content:center;gap:10px;border-left:1px solid #EDEDED;padding-left:14px}
.flowvals>div{display:grid;grid-template-columns:10px 1fr auto;align-items:center;gap:6px;font-size:12.5px}
.flowvals i{width:10px;height:10px;border-radius:3px}
.flowvals b{font-variant-numeric:tabular-nums}
.flowvals .fvtot{grid-template-columns:1fr auto;border-top:1px solid #EDEDED;padding-top:8px;font-weight:700}
.pies{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid #EDEDED}
.pie1{display:flex;gap:8px;align-items:center;font-size:13px;line-height:1.3}
.pie1 b{font-size:15px}
@media (max-width:1180px){.dash2{grid-template-columns:1fr}.dleft{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 18px;padding:6px 18px}.dsec{border-bottom:0}.pies{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:900px){.dleft{grid-template-columns:1fr}.dsec{border-bottom:1px solid #EDEDED}.dstrip{grid-template-columns:1fr}.strip+.strip{border-left:0;border-top:1px solid #EDEDED}}
@media (max-width:560px){.dash2{padding:10px;gap:12px;border-radius:18px}.flow{grid-template-columns:1fr}.flowvals{border-left:0;padding-left:0;border-top:1px solid #EDEDED;padding-top:10px}.pies{grid-template-columns:repeat(2,minmax(0,1fr))}.dbig2 .row.between{flex-direction:column}}
.flowhead{display:flex;gap:14px;align-items:center}
.flowhead .fgauge{width:64px;height:64px;flex:none}
.flowhead .fgauge b{font-size:12px}
.dots span{white-space:nowrap}
.pietxt{display:flex;flex-direction:column;font-size:12px;line-height:1.35;white-space:nowrap;min-width:0}
.pietxt b{font-size:15px}
.pietxt>b+span{display:none}
.pie1 svg{flex:none}
@media (max-width:1180px) and (min-width:901px){.dleft .fgauge{width:70px;height:70px}.dleft .fgauge b{font-size:12px}.g3 p{font-size:11.5px}}
/* business leaderboard */

.lbrow{display:grid;grid-template-columns:34px minmax(150px,1.1fr) minmax(200px,2fr) 150px 64px;align-items:center;gap:14px;padding:9px 6px;border-bottom:1px solid #EDEDED;font-size:14px}

.lbbar b{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.lbst{font-size:12px;text-align:center}
.lbdots,.lbdotsh{display:grid;grid-template-columns:repeat(5,1fr);justify-items:center;gap:4px}
.lbdot{width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(57,69,8,.12)}

@media (max-width:760px){.lbrow{grid-template-columns:30px 1fr 64px;row-gap:6px}.lbbar{grid-column:2/4}.lbdots{grid-column:2/3;justify-items:start;grid-template-columns:repeat(5,22px)}.lbhead .lbdotsh,.lbhead span:nth-child(3){display:none}.lbreach{grid-row:1;grid-column:3}}

.wpill .w1{background:linear-gradient(180deg,#D2FD9C 0%,#B9DD7E 30%,#B9DD7E 70%)!important;opacity:.8!important}

/* alive on click: surge, ripple, bounce */
